  cross_validation:
    n_folds: 10

  multiprocessing:
    n_jobs: -1
    cpu_processes: 1

  caching:
    enabled: true
    pickle_protocol: 4

  export:
    results_csv_columns:
      - timestamp
      - tool
      - model
      - dataset
      - hyperparameters
      - cv_method
      - train_test_split
      - scaling
      - n_components
      - explained_variance
      - cv_accuracy
      - cv_precision
      - cv_recall
      - cv_f1_score
      - test_accuracy
      - test_precision
      - test_recall
      - test_f1_score
      - test_fpr
      - test_fnr
      - feature_extraction_time_s
      - training_time_s
      - testing_time_s
      - hardware

