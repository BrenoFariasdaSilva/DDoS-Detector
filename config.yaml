# ================================================================================
# DDoS-Detector — Unified Configuration File
# ================================================================================
# Central configuration for ALL project scripts:
#   - genetic_algorithm.py  (Genetic Algorithm Feature Selection)
#   - stacking.py           (Stacking Ensemble Classifiers with Combined Files Evaluation Support)
#   - wgangp.py             (WGAN-GP Data Augmentation)
#
# Configuration priority (highest → lowest):
#   1. CLI arguments
#   2. This config.yaml
#   3. Hard-coded defaults in each script's get_default_config()
#
# Sections:
#   [Shared]       execution, dataset, paths, sound, logging, telegram, plotting
#   [GA-specific]  genetic_algorithm, early_stop, cross_validation,
#                  multiprocessing, resource_monitor, model, caching,
#                  progress, export
#   [Stacking]     stacking, evaluation, models, automl, tsne
#   [WGAN-GP]      wgangp, training, generator, discriminator,
#                  gradient_penalty, generation, dataloader
# ================================================================================


# ==============================================================================
# EXECUTION — Used by multiple scripts
# ==============================================================================
execution: # Execution control and per-script overrides
  verbose: false # Enable verbose output messages
  play_sound: true # Play sound notification when complete
  skip_train_if_model_exists: false # Skip training if model artifacts exist
  low_memory: false # Enable low memory mode for pandas operations
  runs: 10 # Number of GA runs per population size
  resume_progress: true # Resume from saved state files
  progress_save_interval: 10 # Save progress every N generations
  csv_file: null # Optional single CSV file to process (null = process all)
  process_entire_dataset: false # Process all files in dataset (true) or single file (false)
  test_data_augmentation: true # Enable data augmentation testing experiments
  classification_mode: "both" # Classification mode: "separate_files", "combined_files", or "both" (default: both)
  results_suffix: "_result" # Suffix to add to generated filenames
  match_filenames_to_process: [""] # List of specific filenames to match
  ignore_files: ["_data_augmented"] # List of filename substrings to ignore
  ignore_dirs: # List of directory names to ignore
    - "Classifiers"
    - "Classifiers_Hyperparameters"
    - "Dataset_Description"
    - "Data_Separability"
    - "Feature_Analysis"

# ------------------------------------------------------------------------------
# Hyperparameters Optimization configuration (mandatory fields for script)
# ------------------------------------------------------------------------------
hyperparameters_optimization:
  execution:
    verbose: false
    n_jobs: -1
    skip_train_if_model_exists: true
    sample_fraction: null # Optional float fraction for grid-search subsampling (null = use full training set; set to e.g. 0.05 for 5%)
    use_linear_svc_for_linear_kernel: true # If true, substitute SVC(kernel='linear') with LinearSVC for faster equivalent linear training
    svm_max_iter: -1  # Use -1 to disable iteration limit as required by sklearn SVC
    enable_parallel_for_non_n_jobs_classifiers: true # Enable custom parallel execution for classifiers without n_jobs support (SVM, NearestCentroid, GradientBoosting, MLP)
    low_memory: false # Enable low memory mode for pandas CSV loading (forced to true when verbose is active)

  export:
    results_dir: "Hyperparameter_Optimization"
    results_filename: "Hyperparameter_Optimization_Results.csv"
    model_export_base_dir: "Hyperparameter_Optimization/Models"
    cache_prefix: "Cache_"

  dataset_processing:
    match_filenames_to_process: [""]
    ignore_files: ["Hyperparameter_Optimization_Results.csv"]
    ignore_dirs:
      - "Classifiers_Hyperparameters"
      - "Dataset_Description"
      - "Data_Separability"
      - "Feature_Analysis"

  enabled_models:
    - "Random Forest"
    - "SVM"
    - "XGBoost"
    - "Logistic Regression"
    - "KNN"
    - "Nearest Centroid"
    - "Gradient Boosting"
    - "LightGBM"
    - "MLP (Neural Net)"

  datasets:
    CICDDoS2019-Dataset:
      - "./Datasets/CICDDoS2019/01-12/"
      - "./Datasets/CICDDoS2019/03-11/"

  results_schema:
    columns:
      - "dataset_name"
      - "dataset_path"
      - "base_csv"
      - "model"
      - "best_params"
      - "best_cv_f1_score"
      - "n_features"
      - "feature_selection_method"
      - "dataset"
      - "elapsed_time_s"
      - "accuracy"
      - "precision"
      - "recall"
      - "fpr"
      - "fnr"
      - "tpr"
      - "tnr"
      - "matthews_corrcoef"
      - "roc_auc_score"
      - "cohen_kappa"
      - "Hardware"

# ==============================================================================
# DATASET — Used by multiple scripts
# ==============================================================================
dataset: # Dataset-level settings and paths
  remove_zero_variance: true # Remove zero-variance features during preprocessing
  files_to_ignore: [] # List of files to ignore during processing
  test_size: 0.2 # Test set size for train-test split
  min_test_fraction: 0.05 # Minimum acceptable test fraction
  max_test_fraction: 0.50 # Maximum acceptable test fraction
  label_candidates: # Common label column names for auto-detection
    - "label"
    - "class"
    - "target"
    - "y"
    - "category"
  datasets: # Dictionary containing dataset paths
    CICDDoS2019-Dataset:
      - "./Datasets/CICDDoS2019/01-12/"
      - "./Datasets/CICDDoS2019/03-11/"

# ==============================================================================
# PATHS — Used by multiple scripts
# ==============================================================================
paths: # File and directory paths used across scripts
  logs_dir: "./Logs" # Directory for log files (shared)
  datasets_dir: null # Directory containing datasets (null for auto-detect)
  output_dir: "Feature_Analysis" # Output directory for GA results
  csv_path: null # Default dataset CSV path (null for auto-detect)
  out_dir: "outputs" # Output directory for WGAN-GP models/logs
  checkpoint_subdir: "Checkpoints" # Checkpoints subdirectory name
  data_augmentation_dir: "Data_Augmentation" # Base directory for all augmentation artifacts
  data_augmentation_sample_dir: "Samples" # Subdirectory containing generated augmented dataset CSV files

# ==============================================================================
# SOUND — Used by multiple scripts
# ==============================================================================
sound: # Sound notification settings
  enabled: true # Enable sound notifications
  commands: # Commands to play sound for each operating system
    Darwin: "afplay"
    Linux: "aplay"
    Windows: "start"
  file: "./.assets/Sounds/NotificationSound.wav" # Path to the sound file

# ==============================================================================
# LOGGING — Used by multiple scripts
# ==============================================================================
logging: # Logging configuration
  enabled: true # Enable file logging
  clean: true # Clear log file on start
  tqdm_bar_format: "{l_bar}{bar}| {n_fmt}/{total_fmt} [{elapsed}<{remaining}, {rate_fmt}]" # Progress bar format

# ==============================================================================
# MEMORY WATCHER — Used by stacking.py diagnostics
# ==============================================================================
memory_watcher: # Low-overhead process and memory diagnostics
  enabled: false # Disabled by default for normal stacking runs
  sample_interval_seconds: 2 # Seconds between watcher samples
  system_memory_threshold_percent: 90 # System memory pressure threshold for transition events
  process_rss_threshold_gb: null # Optional target RSS threshold in GB
  capture_process_tree: true # Record actual recursive child processes separately from threads
  capture_tracemalloc: false # Optional Python-level allocation tracing
  tracemalloc_frame_depth: 25 # Frame depth for optional tracemalloc snapshots
  output_directory: "Logs/Memory_Watch" # Project-relative watcher output root
  keep_watcher_after_target_exit_seconds: 5 # Terminal grace period after target disappears

# ==============================================================================
# TELEGRAM — Used by multiple scripts
# ==============================================================================
telegram: # Telegram notification settings
  enabled: true # Enable Telegram notifications
  verify_env: true # Verify .env file existence
  progress_pct: 10 # Percent interval for progress notifications (e.g., 10 => notify at 10%,20%,...)

# ==============================================================================
# PLOTTING — Used by multiple scripts
# ==============================================================================
plotting: # Plotting defaults and sizes
  enabled: true # Enable plot generation
  filename: "training_metrics.png" # Plot filename
  subdir: "plots" # Subdirectory under data augmentation outputs for plots
  figsize: [18, 10] # Figure size [width, height]
  dpi: 1000 # Image resolution
  subplot_rows: 2 # Number of subplot rows
  subplot_cols: 3 # Number of subplot columns
  linewidth: 1.5 # Line width for plots
  alpha: 0.7 # Transparency for plot lines
  grid_alpha: 0.3 # Grid transparency


# ==============================================================================
# GENETIC ALGORITHM — Used by genetic_algorithm.py
# ==============================================================================

genetic_algorithm:
  n_generations: 200 # Number of generations for GA
  min_pop: 20 # Minimum population size
  max_pop: 20 # Maximum population size
  cxpb: 0.5 # Crossover probability
  mutpb: 0.01 # Mutation probability

  early_stop:
    acc_threshold: 0.75 # Minimum acceptable accuracy for an individual
    folds: 3 # Number of folds to verify before early stopping
    generations: 10 # Number of generations without improvement before early stop

  cross_validation:
    n_folds: 10 # Number of cross-validation folds

  multiprocessing:
    n_jobs: -1 # Number of parallel jobs (-1 uses all processors)
    cpu_processes: 1 # Initial number of worker processes

  resource_monitor:
    enabled: true # Enable resource monitoring
    interval_seconds: 30 # Interval between monitoring cycles in seconds
    reserve_cpu_frac: 0.15 # Fraction of CPU reserved from worker allocation
    reserve_mem_frac: 0.15 # Fraction of memory reserved from worker allocation
    min_procs: 1 # Minimum number of processes allowed
    max_procs: null # Maximum number of processes allowed (null for unlimited)
    min_gens_before_update: 10 # Minimum GA generations before updating workers
    daemon: true # Whether the monitoring thread runs as daemon

  model:
    estimator: "RandomForestClassifier" # Default estimator for GA fitness evaluation
    random_state: null # Random state for reproducibility (null for non-deterministic)

  caching:
    enabled: true # Enable fitness caching
    pickle_protocol: 4 # Pickle protocol to use when saving state

  progress:
    state_dir_name: "ga_progress" # Subfolder under Feature_Analysis to store progress files

  export:
    results_dir: "Feature_Analysis/Genetic_Algorithm"
    results_filename: "Genetic_Algorithm_Results.csv"
    results_csv_columns: # Columns for the results CSV
      - timestamp
      - tool
      - run_index
      - model
      - dataset
      - hyperparameters
      - cv_method
      - train_test_split
      - scaling
      - cv_accuracy
      - cv_precision
      - cv_recall
      - cv_f1_score
      - cv_fpr
      - cv_fnr
      - test_accuracy
      - test_precision
      - test_recall
      - test_f1_score
      - test_fpr
      - test_fnr
      - feature_extraction_time_s
      - training_time_s
      - testing_time_s
      - elapsed_run_time
      - hardware
      - best_features
      - union_features_across_runs
      - rfe_ranking


# ==============================================================================
# EXTRA TREES — Used by extratrees.py and stacking.py
# ==============================================================================

extra_trees:
  execution:
    verbose: false # Enable verbose Extra Trees feature-selection logging
    dataset_path: "./Datasets/CICDDoS2019/01-12/DrDoS_DNS.csv" # Dataset CSV used when running extratrees.py directly
    low_memory: false # Pandas low_memory mode for Extra Trees CSV loading

  dataset:
    test_size: 0.2 # Held-out fraction excluded from Extra Trees ranking fit
    random_state: 42 # Seed used for the training/test split before feature ranking

  selection:
    n_features_to_select: 20 # Default Extra-Trees-20 selected-feature count

  cross_validation:
    enabled: true # Enable training-partition CV diagnostics for the selector model
    n_folds: 3 # StratifiedKFold count used only inside the training partition

  model:
    n_estimators: 200 # Number of Extra Trees estimators
    random_state: 42 # Seed used by ExtraTreesClassifier
    n_jobs: 1 # Worker threads used by ExtraTreesClassifier
    criterion: "gini" # ExtraTreesClassifier split criterion
    max_features: "sqrt" # ExtraTreesClassifier max_features setting

  export:
    results_dir: "Feature_Analysis/Extra_Trees" # Output directory relative to the dataset directory
    results_filename: "Extra_Trees_Results.csv" # Ranked Extra Trees results CSV filename
    results_csv_columns: # Columns for the Extra Trees results CSV
      - timestamp
      - tool
      - run_index
      - model
      - dataset
      - dataset_path
      - hyperparameters
      - cv_method
      - train_test_split
      - scaling
      - cv_accuracy
      - cv_precision
      - cv_recall
      - cv_f1_score
      - cv_fpr
      - cv_fnr
      - test_accuracy
      - test_precision
      - test_recall
      - test_f1_score
      - test_fpr
      - test_fnr
      - feature_extraction_time_s
      - training_time_s
      - testing_time_s
      - elapsed_run_time
      - hardware
      - best_features
      - union_features_across_runs
      - rfe_ranking
      - feature_name
      - original_feature_index
      - extra_trees_importance
      - importance_rank
      - selected
      - configured_selected_feature_count
      - actual_selected_feature_count
      - n_estimators
      - random_state
      - n_jobs
      - n_train
      - n_test
      - source_feature_count
      - eligible_feature_count
      - target_column
      - excluded_columns


# ==============================================================================
# STACKING — Used by stacking.py
# ==============================================================================

stacking: # Stacking experiment settings
  results_dir: "Stacking" # Directory to save stacking results (relative to Feature_Analysis)
  results_filename: "Stacking_Classifiers_Results.csv" # Main results CSV filename for separate_files mode
  cache_results_subdir: "Cache_Results" # Subdir inside results_dir to store the cache results
  combined_files_results_filename: "Stacking_Classifiers_CombinedFiles_Results.csv" # Results CSV filename for combined_files mode
  augmentation_comparison_filename: "Data_Augmentation_Comparison_Results.csv" # Data augmentation experiments results CSV
  hyperparameters_filename: "Hyperparameter_Optimization_Results.csv" # Hyperparameter tuning results filename

  data_augmentation_suffix: "_data_augmented" # Suffix for augmented files (matches wgangp.py output)
  dataset_file_format: "csv" # Supported formats: arff,csv,parquet,txt
  augmentation_file_format: "csv" # Supported formats: arff,csv,parquet,txt
  augmentation_ratios: [0.25, 0.50, 0.75, 1.00] # Augmented-to-original sample ratios for experiments

  top_n_features_heatmap: 15 # Number of top features to show in generated heatmaps and CSV exports (int)
  combined_files_evaluation: true # Default: combined files evaluation enabled. If false, runs separate_files single-file evaluation mode.
  sort_pending_by_elapsed_time: false # When true, pending classifier queues run faster historical elapsed_time_s combinations first within comparable groups.
  experiment_runs: 1 # Total repeated runs required for every logical experiment.

  methods: # Method toggles for stacking pipeline (overridable via CLI)
    augmentation: true # Enable data augmentation combination in pipeline
    automl: true # Enable AutoML pipeline in stacking
    feature_selection: true # Enable feature selection combination in pipeline
    hyperparameter_optimization: true # Enable hyperparameter optimization combination in pipeline
    stacking: true # Enable stacking classifier evaluation

  feature_sets_config: # Configurable feature set strategies (overridable via CLI)
    use_full: true # Enable Full Features strategy (all dataset features)
    use_pca: true # Enable PCA Components strategy (dimensionality reduction)
    use_rfe: true # Enable RFE Features strategy (recursive feature elimination)
    use_ga: true # Enable GA Features strategy (genetic algorithm selection)
    use_extra_trees: true # Enable Extra Trees Features strategy (Extra-Trees-20 feature selection)
    explicit_features: [] # Optional explicit feature list; when non-empty, added as an additional "Explicit Features" set alongside all enabled strategies. Use this carefully, as when analyzing multiple datasets, you must put features common between the datasets.

  memory_management: # Memory lifecycle controls for large feature-selection grids
    spill_full_feature_arrays_after_full_eval: true # Spill full scaled train/test matrices to temporary disk-backed memmaps after Full Features when later feature modes remain.
    spill_min_array_nbytes: 1073741824 # Minimum combined train/test matrix bytes before spilling is used (1 GiB).
    spill_directory: null # Optional directory for temporary spill files (null = dataset Stacking/Array_Cache directory).

  enabled_classifiers: # List of classifier names to include in stacking pipeline (comment entries to disable)
    - Random Forest
    - SVM
    - XGBoost
    - Logistic Regression
    - KNN
    - Nearest Centroid
    - Gradient Boosting
    - LightGBM
    - MLP (Neural Net)
    - FT-Transformer
    - Tabular ResNet
    - ResNet18
    - AutoEncoder
    - LSTM

  cache_prefix: "Cache_" # Prefix for cached preprocessing artifacts
  model_export_base: "Stacking/Models/" # Base directory for model exports
  match_filenames_to_process: [""] # List of specific filenames to match (empty = process all)
  ignore_files: # Result filenames to ignore during processing
    - "Stacking_Classifiers_Results.csv"
    - "Hyperparameter_Optimization_Results.csv"
  ignore_dirs: # Directory names to ignore during processing
    - "Classifiers"
    - "Classifiers_Hyperparameters"
    - "Dataset_Description"
    - "Data_Separability"
    - "Feature_Analysis"

  plots:
    plots_subdir: "Plots/"
    enabled: true
    dpi: 1000
    format: "png"

  results_csv_columns: # Column ordering for final results CSV export
    - "experiment_id" # Unique experiment identifier (timestamp-based)
    - "experiment_run" # One-based repeated experiment run index
    - "experiment_mode" # Experiment type: "original_only" or "original_plus_augmented"
    - "execution_mode" # Execution mode: "separate_files" or "combined_files"
    - "data_source" # Data source label: original, augmented, or combined
    - "dataset" # Dataset path stored by stacking.py
    - "attack_types_combined" # JSON list for combined_files; null for separate_files
    - "augmentation_ratio" # Ratio of augmented-to-original samples (0.0 for baseline/original-only)
    - "feature_selection_enabled" # True only when the effective feature set applies feature selection
    - "hyperparameters_enabled" # True/False for HP toggle
    - "data_augmentation_enabled" # True/False for DA toggle
    - "hyperparameter_mode" # Explicit HP mode label used by resume logic
    - "feature_set" # Feature extraction method (e.g., "PCA", "RFE", "GA")
    - "classifier_type" # Classifier grouping: Individual or Stacking
    - "model_name" # Configured model label (e.g., "Random Forest")
    - "model" # Concrete estimator class name (e.g., "RandomForestClassifier")
    - "n_features" # Number of features used for the evaluated row
    - "n_samples_train" # Number of training samples
    - "n_samples_test" # Number of testing samples
    - "accuracy" # Classification accuracy (0.0-1.0)
    - "precision" # Precision score (0.0-1.0)
    - "recall" # Recall score (0.0-1.0)
    - "f1_score" # F1 score (0.0-1.0)
    - "fpr" # False Positive Rate (0.0-1.0)
    - "fnr" # False Negative Rate (0.0-1.0)
    - "elapsed_time_s" # Elapsed time in seconds for evaluation
    - "cv_method" # Cross-validation method (e.g., "StratifiedKFold")
    - "top_features" # Legacy final-export feature payload, rebuilt from features_list for cache recovery
    - "rfe_ranking" # RFE feature rankings (comma-separated or JSON)
    - "hyperparameters" # Effective estimator hyperparameters used for the evaluated row (JSON string)
    - "features_list" # Canonical complete feature list (JSON string)
    - "Hardware" # Hardware specification (CPU/GPU model)

  cache_results_csv_columns: # Column ordering for temporary cache CSV export
    - "experiment_id" # Unique experiment identifier (timestamp-based)
    - "experiment_run" # One-based repeated experiment run index
    - "experiment_mode" # Experiment type: "original_only" or "original_plus_augmented"
    - "execution_mode" # Execution mode: "separate_files" or "combined_files"
    - "data_source" # Data source label: original, augmented, or combined
    - "dataset" # Dataset path stored by stacking.py
    - "attack_types_combined" # JSON list for combined_files; null for separate_files
    - "augmentation_ratio" # Ratio of augmented-to-original samples (0.0 for baseline/original-only)
    - "feature_selection_enabled" # True only when the effective feature set applies feature selection
    - "hyperparameters_enabled" # True/False for HP toggle
    - "data_augmentation_enabled" # True/False for DA toggle
    - "hyperparameter_mode" # Explicit HP mode label used by resume logic
    - "feature_set" # Feature extraction method (e.g., "PCA", "RFE", "GA")
    - "classifier_type" # Classifier grouping: Individual or Stacking
    - "model_name" # Configured model label (e.g., "Random Forest")
    - "model" # Concrete estimator class name (e.g., "RandomForestClassifier")
    - "n_features" # Number of features used for the evaluated row
    - "n_samples_train" # Number of training samples
    - "n_samples_test" # Number of testing samples
    - "accuracy" # Classification accuracy (0.0-1.0)
    - "precision" # Precision score (0.0-1.0)
    - "recall" # Recall score (0.0-1.0)
    - "f1_score" # F1 score (0.0-1.0)
    - "fpr" # False Positive Rate (0.0-1.0)
    - "fnr" # False Negative Rate (0.0-1.0)
    - "elapsed_time_s" # Elapsed time in seconds for evaluation
    - "cv_method" # Cross-validation method (e.g., "StratifiedKFold")
    - "rfe_ranking" # RFE feature rankings (comma-separated or JSON)
    - "hyperparameters" # Effective estimator hyperparameters used for the evaluated row (JSON string)
    - "features_list" # Canonical complete feature list (JSON string)

  use_suffix_filenames: false # When true, write separate CSVs per combo with suffix

# ==============================================================================
# EVALUATION — Used by stacking.py and other classifiers
# ==============================================================================

evaluation: # Evaluation and CV defaults
  n_jobs: 1 # Number of parallel jobs for model training (1 preserves sequential memory-safe classifier fitting)
  feature_extraction_n_jobs: 1 # Number of threads used for feature extraction/transformation such as PCA (-1 uses available CPUs); classifier training still uses evaluation.n_jobs
  feature_set_workers: {full: 0, ga: 0, pca: 0, rfe: 0, extra_trees: 0} # Persistent Linux feature-set process counts; set full=1,ga=1,pca=1,rfe=1,extra_trees=1 through CLI for five workers
  training_progress_interval_minutes: 15 # Recurring per-classifier training progress and heartbeat interval in positive finite minutes
  threads_limit: 2 # Thread limit for parallel classifier evaluation (prevents resource exhaustion)
  cv_folds: 10 # Number of cross-validation folds for model evaluation
  random_state: 42 # Random seed for reproducibility across all models
  ram_threshold_gb: 32 # RAM threshold (GB) that forces classifier and feature extraction parallelism to 1 for high-memory datasets


# ==============================================================================
# MODEL HYPERPARAMETERS — Used by stacking.py
# ==============================================================================

models: # Model hyperparameters for classifiers
  random_forest: # Random Forest classifier hyperparameters
    n_estimators: 100 # Number of trees in the forest
    random_state: 42 # Random seed for reproducibility

  svm: # Support Vector Machine hyperparameters
    kernel: "rbf" # Kernel type: "linear", "poly", "rbf", "sigmoid"
    probability: true # Enable probability estimates for predict_proba()
    random_state: 42 # Random seed for reproducibility

  xgboost: # XGBoost classifier hyperparameters
    eval_metric: "mlogloss" # Evaluation metric: "mlogloss" for combined_files, "logloss" for separate_files
    random_state: 42 # Random seed for reproducibility

  logistic_regression: # Logistic Regression hyperparameters
    max_iter: 1000 # Maximum iterations for solver convergence
    random_state: 42 # Random seed for reproducibility

  knn: # K-Nearest Neighbors hyperparameters
    n_neighbors: 5 # Number of neighbors to consider

  gradient_boosting: # Gradient Boosting classifier hyperparameters
    random_state: 42 # Random seed for reproducibility

  lightgbm: # LightGBM classifier hyperparameters
    force_row_wise: true # Force row-wise histogram construction (bool)
    min_gain_to_split: 0.01 # Minimum information gain to make a split (float)
    random_state: 42 # Random seed for reproducibility
    verbosity: -1 # Suppress warnings (int)

  mlp: # Multi-layer Perceptron hyperparameters
    hidden_layer_sizes: [100] # Hidden layer sizes (list[int])
    max_iter: 500 # Maximum training iterations (int)
    random_state: 42 # Random seed for reproducibility

  ft_transformer: # FT-Transformer hyperparameters controlled by stacking.enabled_classifiers
    epochs: 20 # Maximum mini-batch training epochs
    batch_size: 1024 # Training and internal-validation batch size
    token_dim: 32 # Numeric feature token dimension
    n_blocks: 2 # Transformer encoder block count
    n_heads: 4 # Attention head count; token_dim must be divisible by this value
    dropout: 0.1 # Transformer dropout probability
    ffn_multiplier: 2.0 # Feed-forward width multiplier
    learning_rate: 0.001 # AdamW learning rate
    weight_decay: 0.00001 # AdamW weight decay
    patience: 3 # Internal-validation early-stopping patience
    validation_fraction: 0.1 # Fraction derived only from training rows for early stopping
    min_delta: 0.0001 # Minimum internal-validation loss improvement
    activation: "gelu" # Transformer feed-forward activation: gelu or relu
    device: "auto" # Device selection: auto, cuda, mps, or cpu
    prediction_batch_size: 4096 # Bounded inference batch size
    torch_threads: 1 # Native PyTorch CPU threads per FT-Transformer process
    random_state: 42 # Deterministic model, split, and batch-order seed
    search_space: # Bounded AutoML ranges used only when FT-Transformer is explicitly enabled
      epochs: ["int", 5, 30] # Epoch range
      batch_size: ["categorical", [256, 512, 1024, 2048]] # Training batch choices
      token_dim: ["categorical", [16, 32, 64]] # Token dimension choices
      n_blocks: ["int", 1, 4] # Transformer block range
      n_heads: ["categorical", [2, 4, 8]] # Attention head choices compatible with token choices
      dropout: ["float", 0.0, 0.3] # Dropout range
      ffn_multiplier: ["categorical", [2.0, 4.0]] # Feed-forward multiplier choices
      learning_rate: ["float_log", 0.0001, 0.003] # Learning-rate range
      weight_decay: ["float_log", 0.000001, 0.001] # Weight-decay range
      patience: ["int", 2, 6] # Early-stopping patience range

  tabular_resnet: # Tabular ResNet hyperparameters controlled by stacking.enabled_classifiers
    epochs: 20 # Maximum mini-batch training epochs
    batch_size: 1024 # Training and internal-validation batch size
    hidden_width: 128 # Hidden representation width
    n_blocks: 3 # Residual block count
    normalization: "batch_norm" # Normalization layer: batch_norm, layer_norm, or none
    activation: "relu" # Activation function: relu, gelu, or silu
    dropout: 0.1 # Dropout probability
    learning_rate: 0.001 # AdamW learning rate
    weight_decay: 0.00001 # AdamW weight decay
    patience: 3 # Internal-validation early-stopping patience
    validation_fraction: 0.1 # Fraction derived only from training rows for early stopping
    min_delta: 0.0001 # Minimum internal-validation loss improvement
    device: "auto" # Device selection: auto, cuda, mps, or cpu
    prediction_batch_size: 4096 # Bounded inference batch size
    data_loader_workers: 0 # Batch loading worker count; zero avoids cross-process array duplication
    torch_threads: 1 # Native PyTorch CPU threads per Tabular ResNet process
    random_state: 42 # Deterministic model, split, and batch-order seed
    search_space: # Bounded AutoML ranges used only when Tabular ResNet is explicitly enabled
      epochs: ["int", 5, 30] # Epoch range
      batch_size: ["categorical", [256, 512, 1024, 2048]] # Training batch choices
      hidden_width: ["categorical", [64, 128, 256]] # Hidden width choices
      n_blocks: ["int", 1, 5] # Residual block range
      normalization: ["categorical", ["batch_norm", "layer_norm", "none"]] # Normalization choices
      activation: ["categorical", ["relu", "gelu", "silu"]] # Activation choices
      dropout: ["float", 0.0, 0.4] # Dropout range
      learning_rate: ["float_log", 0.0001, 0.003] # Learning-rate range
      weight_decay: ["float_log", 0.000001, 0.001] # Weight-decay range
      patience: ["int", 2, 6] # Early-stopping patience range

  resnet18: # One-dimensional ResNet18 hyperparameters controlled by stacking.enabled_classifiers
    architecture_variant: "resnet18_1d" # Factual tabular feature-axis architecture variant
    epochs: 20 # Maximum mini-batch training epochs
    batch_size: 1024 # Training and internal-validation batch size
    initial_channels: 32 # Short-feature-safe stem channel width
    stage_widths: [32, 64, 128, 256] # Four residual-stage widths
    kernel_size: 3 # Odd padding-safe one-dimensional convolution kernel size
    normalization: "batch_norm" # Normalization layer: batch_norm, group_norm, or none
    activation: "relu" # Activation function: relu, gelu, or silu
    dropout: 0.1 # Dropout probability
    learning_rate: 0.001 # Optimizer learning rate
    weight_decay: 0.00001 # Optimizer weight decay
    optimizer: "adamw" # Optimizer: adamw, adam, or sgd
    class_weight: "none" # Class weighting: none or balanced
    patience: 3 # Internal-validation early-stopping patience
    validation_fraction: 0.1 # Fraction derived only from training rows for early stopping
    min_delta: 0.0001 # Minimum internal-validation loss improvement
    device: "auto" # Device selection: auto, cuda, mps, or cpu
    allow_device_fallback: true # Fall back to CPU when requested accelerator is unavailable
    prediction_batch_size: 4096 # Bounded inference batch size
    data_loader_workers: 0 # Zero preserves CPU-backed array and memmap streaming
    mixed_precision: false # CUDA-only mixed precision
    gradient_clip_norm: null # Optional gradient clipping norm
    torch_threads: 1 # Native PyTorch CPU threads per ResNet18 process
    random_state: 42 # Deterministic model, split, and batch-order seed
    search_space: # Bounded AutoML ranges used only when ResNet18 is explicitly enabled
      epochs: ["int", 5, 20] # Epoch range
      batch_size: ["categorical", [512, 1024, 2048]] # Training batch choices
      initial_channels: ["categorical", [16, 32, 64]] # Stem channel choices
      stage_widths: ["categorical", [[16, 32, 64, 128], [32, 64, 128, 256]]] # Stage-width choices
      kernel_size: ["categorical", [3, 5]] # Kernel-size choices
      normalization: ["categorical", ["batch_norm", "group_norm", "none"]] # Normalization choices
      activation: ["categorical", ["relu", "gelu", "silu"]] # Activation choices
      dropout: ["float", 0.0, 0.3] # Dropout range
      learning_rate: ["float_log", 0.0001, 0.003] # Learning-rate range
      weight_decay: ["float_log", 0.000001, 0.001] # Weight-decay range
      optimizer: ["categorical", ["adamw", "adam"]] # Optimizer choices
      class_weight: ["categorical", ["none", "balanced"]] # Class-weight choices
      patience: ["int", 2, 5] # Early-stopping patience range

  autoencoder: # Supervised Autoencoder hyperparameters controlled by stacking.enabled_classifiers
    training_strategy: "joint" # Training strategy: joint supervised reconstruction and classification
    epochs: 20 # Maximum joint mini-batch training epochs
    batch_size: 1024 # Training and internal-validation batch size
    encoder_hidden_dims: [128, 64] # Encoder hidden dimensions
    decoder_hidden_dims: [] # Empty list mirrors encoder hidden dimensions in reverse order
    latent_dim: null # Explicit latent dimension; null uses latent_ratio
    latent_ratio: 0.25 # Deterministic latent bottleneck ratio when latent_dim is null
    classifier_hidden_dims: [64] # Classification-head hidden dimensions
    activation: "relu" # Activation function: relu, gelu, or silu
    normalization: "batch_norm" # Normalization layer: batch_norm, layer_norm, or none
    dropout: 0.1 # Dropout probability
    denoising_noise: 0.0 # Training-only Gaussian input noise level
    reconstruction_loss: "mse" # Reconstruction loss: mse or mae
    reconstruction_loss_weight: 0.5 # Reconstruction objective weight
    classification_loss_weight: 1.0 # Multiclass classification objective weight
    learning_rate: 0.001 # AdamW learning rate
    weight_decay: 0.00001 # AdamW weight decay
    patience: 3 # Internal-validation early-stopping patience
    validation_fraction: 0.1 # Fraction derived only from training rows for early stopping
    min_delta: 0.0001 # Minimum internal-validation loss improvement
    device: "auto" # Device selection: auto, cuda, mps, or cpu
    allow_device_fallback: true # Fall back to CPU when requested accelerator is unavailable
    prediction_batch_size: 4096 # Bounded inference batch size
    data_loader_workers: 0 # Zero preserves CPU-backed array and memmap streaming
    torch_threads: 1 # Native PyTorch CPU threads per Autoencoder process
    random_state: 42 # Deterministic model, split, and batch-order seed
    search_space: # Bounded AutoML ranges used only when Autoencoder is explicitly enabled
      epochs: ["int", 5, 20] # Epoch range
      batch_size: ["categorical", [512, 1024, 2048]] # Training batch choices
      encoder_hidden_dims: ["categorical", [[128, 64], [256, 128]]] # Encoder width choices
      latent_ratio: ["categorical", [0.125, 0.25, 0.5]] # Latent ratio choices
      classifier_hidden_dims: ["categorical", [[64], [128]]] # Classification-head width choices
      activation: ["categorical", ["relu", "gelu", "silu"]] # Activation choices
      normalization: ["categorical", ["batch_norm", "layer_norm", "none"]] # Normalization choices
      dropout: ["float", 0.0, 0.3] # Dropout range
      denoising_noise: ["float", 0.0, 0.1] # Denoising noise range
      reconstruction_loss_weight: ["float", 0.1, 1.0] # Reconstruction objective weight range
      learning_rate: ["float_log", 0.0001, 0.003] # Learning-rate range
      weight_decay: ["float_log", 0.000001, 0.001] # Weight-decay range
      patience: ["int", 2, 5] # Early-stopping patience range

  lstm: # Supervised LSTM hyperparameters controlled by stacking.enabled_classifiers
    sequence_length: 8 # Required timestep count for upstream partition-local windows
    sequence_stride: 1 # Sequence-window stride recorded in artifacts and model parameters
    minimum_group_length: 8 # Minimum upstream group length required before windowing
    chronological_field: null # Chronological metadata field is not retained by current row-wise stacking inputs
    group_fields: [] # Grouping metadata fields are not retained by current row-wise stacking inputs
    label_strategy: "final_timestep" # Predict label of final timestep in each sequence
    mixed_label_window_policy: "keep" # Upstream policy metadata for mixed-label windows
    incomplete_window_policy: "drop" # Upstream policy for incomplete windows
    trusted_sequence_input: false # Require verified pre-windowed 3D tensors before fitting
    hidden_size: 128 # LSTM hidden size
    num_layers: 1 # Recurrent layer count
    bidirectional: false # Default causal unidirectional recurrence
    dropout: 0.1 # Dropout probability
    normalization: "layer_norm" # Classification-head normalization: layer_norm or none
    classifier_hidden_dims: [64] # Classification-head hidden dimensions
    activation: "relu" # Activation function: relu, gelu, or silu
    epochs: 20 # Maximum mini-batch training epochs
    batch_size: 1024 # Training and internal-validation batch size
    learning_rate: 0.001 # Optimizer learning rate
    weight_decay: 0.00001 # Optimizer weight decay
    optimizer: "adamw" # Optimizer: adamw, adam, or sgd
    class_weight: "none" # Class weighting: none or balanced
    patience: 3 # Internal-validation early-stopping patience
    validation_fraction: 0.1 # Fraction derived only from training sequences for early stopping
    min_delta: 0.0001 # Minimum internal-validation loss improvement
    device: "auto" # Device selection: auto, cuda, mps, or cpu
    allow_device_fallback: true # Fall back to CPU when requested accelerator is unavailable
    prediction_batch_size: 4096 # Bounded inference batch size
    data_loader_workers: 0 # Zero preserves CPU-backed sequence array and memmap streaming
    mixed_precision: false # CUDA-only mixed precision
    gradient_clip_norm: null # Optional gradient clipping norm
    torch_threads: 1 # Native PyTorch CPU threads per LSTM process
    random_state: 42 # Deterministic model, split, and batch-order seed
    sequence_source_row_count: null # Optional upstream source-row count metadata
    discarded_prefix_rows: null # Optional upstream discarded-prefix metadata
    mixed_label_windows: null # Optional upstream mixed-label-window metadata
    skipped_groups: null # Optional upstream skipped-group metadata
    search_space: # Bounded AutoML ranges used only when LSTM is explicitly enabled
      epochs: ["int", 5, 20] # Epoch range
      batch_size: ["categorical", [512, 1024, 2048]] # Training batch choices
      hidden_size: ["categorical", [64, 128, 256]] # LSTM hidden-size choices
      num_layers: ["int", 1, 2] # Recurrent-layer range
      dropout: ["float", 0.0, 0.3] # Dropout range
      learning_rate: ["float_log", 0.0001, 0.003] # Learning-rate range
      weight_decay: ["float_log", 0.000001, 0.001] # Weight-decay range
      gradient_clip_norm: ["categorical", [null, 1.0, 5.0]] # Gradient clipping choices
      class_weight: ["categorical", ["none", "balanced"]] # Class-weight choices
      patience: ["int", 2, 5] # Early-stopping patience range

  stacking_meta: # Meta-estimator for stacking classifier
    n_estimators: 50 # Number of estimators for stacking meta-estimator
    random_state: 42 # Random seed for the stacking meta-estimator

automl:
  enabled: true # Enable AutoML Optuna pipeline
  n_trials: 50 # Number of Optuna trials for model search
  stacking_trials: 20 # Number of Optuna trials for stacking search
  timeout: 3600 # Timeout in seconds per search phase
  cv_folds: 5 # Cross-validation folds for AutoML evaluation
  random_state: 42 # Random seed for AutoML reproducibility
  stacking_top_n: 5 # Number of top models to consider for stacking
  results_filename: "AutoML_Results.csv" # AutoML results export filename

tsne:
  perplexity: 30 # t-SNE perplexity parameter
  random_state: 42 # Random seed for t-SNE
  n_iter: 1000 # Number of t-SNE iterations
  figsize: [12, 10] # Figure size for t-SNE plots
  dpi: 1000 # DPI for t-SNE plots
  alpha: 0.6 # Marker transparency
  marker_size: 50 # Marker size for scatter plots

explainability:
  enabled: true # Enable model explainability (SHAP, LIME, permutation importance)
  shap: true # Enable SHAP explanations (TreeExplainer/LinearExplainer/KernelExplainer)
  lime: true # Enable LIME local interpretable model-agnostic explanations
  permutation_importance: true # Enable permutation feature importance
  feature_importance: true # Enable built-in model feature importance extraction
  pdp: true # Enable Partial Dependence Plots (advanced feature)
  ice: true # Enable Individual Conditional Expectation plots (advanced feature)
  surrogate: true # Enable surrogate model explanations (advanced feature)
  max_display_features: 20 # Maximum number of features to display in plots
  lime_num_samples: 1000 # Number of samples for LIME neighborhood generation
  shap_max_samples: 100 # Maximum test samples to use for SHAP (reduces computation time)
  background: false # Legacy setting retained; RAM-gated process dispatch is selected automatically by stacking.py
  random_state: 42 # Random seed for explainability reproducibility
  output_subdir: "Explainability"

# ==============================================================================
